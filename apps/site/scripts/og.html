<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- The share card: the landing's first viewport, condensed. Colours are the light scheme's tokens
     (@baymutt/web's styles), written out because this page loads no stylesheet. -->
<style>
  @font-face { font-family: Schibsted; src: url("{{sans}}") format("woff2"); font-weight: 400 900; }
  @font-face { font-family: GeistMono; src: url("{{mono}}") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 56px 72px 0;
    background: oklch(0.972 0.008 85);
    color: oklch(0.24 0.02 250);
    font-family: Schibsted, system-ui, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 650; letter-spacing: -0.02em; }
  .brand svg { width: 40px; height: 40px; color: oklch(0.72 0.1 72); }
  h1 { align-self: center; max-width: 15ch; font-size: 76px; font-weight: 650; line-height: 1.02; letter-spacing: -0.035em; }
  .bay {
    margin: 0 -72px;
    padding: 28px 72px 36px;
    background: oklch(0.27 0.036 228);
    color: oklch(0.94 0.008 220);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 26px;
  }
  .bay strong { font-weight: 600; }
  code { font-family: GeistMono, monospace; font-size: 24px; }
  .wait { padding: 8px 18px; border-radius: 8px; background: oklch(0.31 0.04 205); box-shadow: inset 0 0 0 2px oklch(0.82 0.095 195); font-size: 22px; font-weight: 500; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M10 3h12a5 5 0 0 1 5 5v13a8 8 0 0 1-8 8h-6a8 8 0 0 1-8-8V8a5 5 0 0 1 5-5Zm6 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
    baymutt
  </div>
  <h1>Agents use secrets without asking you. Only you widen what they can read.</h1>
  <div class="bay">
    <span><strong>Mac mini</strong> asks to <strong>read</strong> <code>app/production</code></span>
    <span class="wait">waits for you</span>
  </div>
</body>
</html>
